# XinWeb 3D 网站 Nginx 配置
# 保存为: /etc/nginx/sites-available/xinweb
# 创建软链接: ln -s /etc/nginx/sites-available/xinweb /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name xinweb.com www.xinweb.com;  # 修改为你的域名
    return 301 https://$server_name$request_uri;  # HTTP 重定向到 HTTPS
}

server {
    listen 443 ssl http2;
    server_name xinweb.com www.xinweb.com;  # 修改为你的域名
    
    # SSL 证书路径（使用 Let's Encrypt 或购买证书）
    ssl_certificate /etc/letsencrypt/live/xinweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xinweb.com/privkey.pem;
    
    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;
    
    # 主网站反向代理
    location / {
        proxy_pass http://localhost:5000;  # Node.js 应用端口
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 缓存设置
        proxy_cache STATIC;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        
        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # 静态文件优化（直接由 Nginx 服务）
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|ttf|woff|woff2)$ {
        root /var/www/xinweb;  # 修改为你的项目路径
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # 启用 Brotli 压缩（如果支持）
        brotli on;
        brotli_types text/plain text/css application/javascript application/json image/svg+xml;
        
        # 文件不存在时回退到应用
        try_files $uri @proxy_to_app;
    }
    
    # 3D 模型文件特殊处理（大文件）
    location ~* \.(stl|gltf|glb|bin)$ {
        root /var/www/xinweb;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        
        # 限流：大文件下载
        limit_rate 500k;  # 限制下载速度
        limit_req zone=download burst=5 nodelay;
        
        try_files $uri @proxy_to_app;
    }
    
    # 管理后台保护（只允许特定 IP 访问）
    location /admin/ {
        # IP 白名单（修改为你的 IP）
        allow 192.168.1.0/24;  # 内网
        allow 你的公网IP;      # 你的公网 IP
        deny all;
        
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # 基础认证（额外保护层）
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
    
    # 健康检查接口（公开访问）
    location /health {
        proxy_pass http://localhost:5000/health;
        access_log off;
    }
    
    # API 接口
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        
        # API 限流
        limit_req zone=api burst=20 nodelay;
        
        # CORS 设置
        add_header 'Access-Control-Allow-Origin' 'https://xinweb.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    }
    
    # 错误页面
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # 回退位置
    location @proxy_to_app {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 限流区域定义（在 http 块中添加）
# http {
#     limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
#     limit_req_zone $binary_remote_addr zone=download:10m rate=2r/s;
#     limit_conn_zone $binary_remote_addr zone=addr:10m;
# }

# 缓存定义
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=24h max_size=1g;

# 日志格式
log_format xinweb '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  '$request_time $upstream_response_time';

access_log /var/log/nginx/xinweb.access.log xinweb;
error_log /var/log/nginx/xinweb.error.log warn;